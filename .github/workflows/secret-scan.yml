name: secret-scan

# Secret-scanning guardrail. Scans the FULL git history on every PR and every
# push to main. Config lives in .gitleaks.toml (baseline verified clean 2026-09-05).
# Modeled on the Radix Guild repository's secret-scan.yml (radixguild/guild).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    # ubuntu-slim (1 vCPU): this job does ~10 s of work and private-repo minutes
    # bill PER JOB, ROUNDED UP, so the runner RATE is the only lever left —
    # $0.002/min here vs $0.006 on ubuntu-latest (rationale and measurements:
    # radixguild/guild .github/workflows/test.yml). slim has no sudo, hence the
    # user-dir install below.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # Pinned + checksum-verified below. Bump in lockstep with .gitleaks.toml's
      # documented baseline version.
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, read from the v8.30.1 release's
      # checksums file on 2026-10-06 and re-verified against a fresh download.
      # Bump TOGETHER with GITLEAKS_VERSION.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history — gitleaks scans every commit, not just the diff.
          fetch-depth: 0

      - name: refuse to scan a shallow clone (fail closed)
        # `--log-opts=HEAD` in the scan step below only walks commits reachable
        # from HEAD and present in the local checkout. That is equivalent to a
        # full-history scan ONLY because `fetch-depth: 0` above makes HEAD's own
        # history complete. If depth were ever shallowed, gitleaks would silently
        # scan whatever few commits happened to be present, report "0 leaks", and
        # the job would go green having proven nothing. This check makes that
        # failure loud instead of silent, before installing gitleaks at all.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::This checkout is SHALLOW. gitleaks git --log-opts=HEAD only sees commits present locally, so a shallow clone would report a false '0 leaks' instead of failing. Fix: restore 'fetch-depth: 0' on the checkout step above. Refusing to run the scan." >&2
            exit 1
          fi

      - name: install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          # First assertion: the digest pinned in THIS file. A checksums file fetched
          # from the same release as the binary proves the download was not corrupted,
          # not that the asset is the one we reviewed — a replaced asset ships a
          # matching checksums.txt. The pin is what a reviewer can diff.
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          # Second assertion: the release's own checksums file still agrees.
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          mkdir -p "$RUNNER_TEMP/bin" && mv gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: scan git history
        # Exits non-zero if any secret is found (default exit code 1). --redact
        # keeps real secret values out of CI logs. --log-opts=HEAD scopes the walk
        # to commits reachable from HEAD; on pull_request that is the PR's
        # commits plus the whole base branch, so everything that could reach
        # main is still scanned every time. Preceded by the shallow-clone guard
        # above, which is what keeps this scoping from ever running unchecked
        # against a truncated history.
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --log-opts=HEAD
