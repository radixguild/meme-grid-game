# gitleaks config — meme-grid-game
# Secret-scanning guardrail for this public repository.
# Runs in CI via .github/workflows/secret-scan.yml. Pinned to gitleaks 8.30.x semantics
# to match the CI job's pinned GITLEAKS_VERSION.
#
# Baseline: a full-history scan of this repository against gitleaks' default ruleset
# with no allowlist at all finds ZERO leaks —
#   gitleaks git --no-banner --redact -c /dev/null --log-opts=HEAD
# (re-run 2026-11-27 over the 31 commits then on main; re-run it rather than trust a
# count written here). `useDefault = true` below inherits that same ruleset.
#
# There is NO allowlist, on purpose: nothing benign-but-flagged needs carving out, and
# the `.env.example` files are scanned like every other file, so a real secret pasted
# into one fails CI. secret-scan.yml's self-test step proves that on every run. If a
# future scan turns up a genuine false positive (a doc placeholder, a test fixture
# shaped like a key), add a narrowly-scoped, value-targeted `regexes` entry in an
# allowlist table — never a whole-file or whole-path exemption — so a real secret
# landing in the same file still trips the scanner.

title = "meme-grid-game gitleaks config"

[extend]
useDefault = true
