<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="dice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="4"/>
  <!-- Dice body -->
  <rect x="156" y="146" width="200" height="200" rx="32" fill="url(#dice)" transform="rotate(-12 256 246)"/>
  <!-- Dice dots (showing 6 = jackpot) -->
  <circle cx="205" cy="195" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <circle cx="205" cy="246" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <circle cx="205" cy="297" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <circle cx="307" cy="195" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <circle cx="307" cy="246" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <circle cx="307" cy="297" r="16" fill="#10b981" transform="rotate(-12 256 246)"/>
  <!-- MEME text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="white" letter-spacing="4">MEME</text>
</svg>
