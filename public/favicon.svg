<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>
  <!-- 3x3 grid cells representing the game board -->
  <!-- Row 1 -->
  <rect x="6"  y="6"  width="14" height="14" rx="2" fill="#39ff14" opacity="0.9"/>
  <rect x="25" y="6"  width="14" height="14" rx="2" fill="#39ff14" opacity="0.3"/>
  <rect x="44" y="6"  width="14" height="14" rx="2" fill="#39ff14" opacity="0.7"/>
  <!-- Row 2 -->
  <rect x="6"  y="25" width="14" height="14" rx="2" fill="#39ff14" opacity="0.5"/>
  <rect x="25" y="25" width="14" height="14" rx="2" fill="#bf00ff" opacity="0.9"/>
  <rect x="44" y="25" width="14" height="14" rx="2" fill="#39ff14" opacity="0.4"/>
  <!-- Row 3 -->
  <rect x="6"  y="44" width="14" height="14" rx="2" fill="#39ff14" opacity="0.6"/>
  <rect x="25" y="44" width="14" height="14" rx="2" fill="#00e5ff" opacity="0.8"/>
  <rect x="44" y="44" width="14" height="14" rx="2" fill="#39ff14" opacity="1.0"/>
</svg>
